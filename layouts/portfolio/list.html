{{ define "main" }}
<div id="password-protect">
  <p>Please enter the password to view this page:</p>
  <input type="password" id="pw" />
  <button onclick="checkPassword()">Submit</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="protected-content" style="display:none;">
  {{ .Content }}
  {{ range .Pages }}
    <div>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </div>
  {{ end }}
</div>

<script>
  const PASSWORD = "goodhiringdecision";

  function checkPassword() {
    const entered = document.getElementById("pw").value;
    if (entered === PASSWORD) {
      document.getElementById("password-protect").style.display = "none";
      document.getElementById("protected-content").style.display = "block";
    } else {
      document.getElementById("error").innerText = "Incorrect password.";
    }
  }
</script>
{{ end }}
